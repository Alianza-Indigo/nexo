name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexo_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexo_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexo_ci
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/nexo_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run protocol:verify
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
        env:
          AUTH_SECRET: build-only-secret-with-at-least-thirty-two-characters
          FIELD_ENCRYPTION_KEY_CURRENT: build-only-encryption-key-with-at-least-thirty-two-characters
          SUPERADMIN_EMAIL: admin@example.com
          SUPERADMIN_PASSWORD: build-only-superadmin-password
          AI_PRIMARY_PROVIDER: gemini
          AI_PRIMARY_MODEL: gemini-3.1-flash-lite
          AI_PRIMARY_API_KEY: build-placeholder-key
          STT_PROVIDER: gemini
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
