name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run protocol:verify
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          DIRECT_URL: postgresql://build:build@localhost:5432/build
          AUTH_SECRET: build-only-secret-with-at-least-thirty-two-characters
          FIELD_ENCRYPTION_KEY_CURRENT: build-only-encryption-key-with-at-least-thirty-two-characters
          AI_PRIMARY_PROVIDER: gemini
          AI_PRIMARY_MODEL: gemini-3.1-flash-lite
          AI_PRIMARY_API_KEY: build-placeholder-key
          STT_PROVIDER: gemini
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
